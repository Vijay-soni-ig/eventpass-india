services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm
    volumes:
      - ..:/workspaces/eventpass-india:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eventpass_dev
      JWT_SECRET: exhibit-tix-local-dev-only-secret-change-if-needed
      NODE_ENV: development
      PORT: 4000
      PAYMENT_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpass_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventpass_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
