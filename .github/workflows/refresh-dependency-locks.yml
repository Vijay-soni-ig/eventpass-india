name: Refresh dependency lockfiles

on:
  push:
    branches:
      - security/dependency-remediation-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh backend lockfile
        run: npm --prefix server install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json server/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): refresh dependency lockfiles"
          git push
