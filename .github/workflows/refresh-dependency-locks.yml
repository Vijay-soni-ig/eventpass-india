name: Refresh dependency lockfiles

on:
  push:
    branches:
      - security/dependency-remediation-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - name: Verify frontend audit
        run: npm audit --audit-level=high
      - name: Verify backend audit
        run: npm --prefix server audit --audit-level=high
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json server/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): refresh dependency lockfiles"
          git push
