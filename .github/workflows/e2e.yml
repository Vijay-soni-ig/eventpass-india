name: Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-event:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventpass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventpass_test
      JWT_SECRET: ci-test-secret
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run prisma:generate

      - name: Apply Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        run: npx prisma db seed

      - name: Build backend
        run: npm --prefix server run build

      - name: Seed deterministic E2E event
        run: node e2e/seed-universal-event.cjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: npm --prefix server start > /tmp/eventpass-server.log 2>&1 &

      - name: Start frontend
        run: npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/eventpass-web.log 2>&1 &

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null && curl -fsS http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/eventpass-server.log || true
          cat /tmp/eventpass-web.log || true
          exit 1

      - name: Run browser E2E
        run: npx playwright test e2e/event-public.spec.ts e2e/event-lead-capture.spec.ts --reporter=line
