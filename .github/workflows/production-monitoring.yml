name: Production Monitoring
run-name: ${{ vars.PRODUCTION_API_URL != '' && 'Production Monitoring' || 'Production Monitoring — NOT CONFIGURED' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring-not-configured:
    if: ${{ vars.PRODUCTION_API_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report that production monitoring is not configured
        run: |
          {
            echo "## Production monitoring: NOT CONFIGURED"
            echo ""
            echo "No production health request was made because the repository variable `PRODUCTION_API_URL` is empty."
            echo ""
            echo "A successful workflow run in this state is not evidence that a production service is healthy."
            echo "Provision the production target and configure `PRODUCTION_API_URL` to enable health checks."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Production monitoring is NOT CONFIGURED. No health request was made."

  health:
    if: ${{ vars.PRODUCTION_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production API health
        run: node scripts/verify-production.mjs

      - name: Report monitoring failure
        if: failure()
        run: |
          echo "::error::Production health/readiness check failed. Review the workflow run and production service logs."
