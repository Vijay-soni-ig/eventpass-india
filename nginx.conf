server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/nginx-security-headers.conf;

  # The sitemap lists published events, so it is generated by the API. Without this it would fall
  # through to the single-page app and crawlers would be served index.html. Resolved per request so
  # the frontend still starts if the API container is briefly unavailable.
  location = /sitemap.xml {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
    include /etc/nginx/nginx-security-headers.conf;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
