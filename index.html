<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExhibitTix - Discover, Book & Exhibit at Top Events in India</title>
    <meta name="description" content="India's premier platform for discovering and booking tickets to exhibitions, trade fairs, cultural events, and more. Secure payments, instant QR tickets." />
    <meta name="author" content="ExhibitTix" />
    <meta name="keywords" content="exhibitions, trade fairs, events, tickets, India, Ahmedabad, booking, cultural events" />
    <link rel="canonical" href="https://exhibittix.com" />

    <meta property="og:title" content="ExhibitTix - Discover, Book & Exhibit at Top Events" />
    <meta property="og:description" content="India's premier platform for discovering and booking tickets to exhibitions, trade fairs, and cultural events." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://exhibittix.com/og-image.jpg" />
    <meta property="og:url" content="https://exhibittix.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ExhibitTix" />
    <meta name="twitter:image" content="https://exhibittix.com/og-image.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Homepage-only structured data (UI-02) — Organization/WebSite, the
         same safe pair ExhibitionDetail.tsx's own per-event JSON-LD avoids
         duplicating. Every field here is real (name/url) with nothing
         fabricated (no aggregateRating, no fake review counts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExhibitTix",
        "url": "https://exhibittix.com"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ExhibitTix",
        "url": "https://exhibittix.com"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
